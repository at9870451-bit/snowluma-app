# 路线 B 第一阶段：把 iSH 内核编译成 iOS 静态库（libish.a 系列）
# 目标：验证在 GitHub Actions macOS runner 上能产出可嵌入 Flutter 的 .a
# 说明：iSH 源码在每次构建时从上游 clone（GPLv2 合规：源码指向上游仓库）
name: Build iSH iOS Static Libraries

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ish-lib.yml'
      - 'native/ish/**'

permissions:
  contents: write

jobs:
  build-ish:
    name: libish.a (iOS device)
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Clone iSH (with submodules)
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/ish-app/ish native/ish
          echo "=== iSH 顶层 ==="
          ls native/ish | head -20

      - name: 安装构建工具（meson / ninja / llvm）
        run: |
          brew install meson ninja 2>&1 | tail -3
          # llvm 是 keg-only，手动加入 PATH（macos-15-intel 前缀为 /usr/local）
          echo "/usr/local/opt/llvm/bin" >> "$GITHUB_PATH"
          meson --version
          ninja --version

      - name: 下载完整 LLVM（提供 ELF 版 ld.lld）
        run: |
          curl -sL -o /tmp/llvm.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-apple-darwin.tar.xz
          mkdir -p /tmp/llvm-full
          tar -xJf /tmp/llvm.tar.xz -C /tmp/llvm-full --strip-components=1
          ls -l /tmp/llvm-full/bin/ld.lld 2>/dev/null || ls -l /tmp/llvm-full/bin/lld 2>/dev/null || echo "!! 无 ld.lld"
          # 放进用户默认 PATH 目录，xcode script phase 才能找到
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /tmp/llvm-full/bin/ld.lld /usr/local/bin/ld.lld
          sudo ln -sf /tmp/llvm-full/bin/ld.lld /usr/local/bin/lld
          /usr/local/bin/ld.lld --version 2>&1 | head -2 || true

      - name: 列出 Xcode targets
        run: |
          cd native/ish
          xcodebuild -project iSH.xcodeproj -list 2>&1 | head -50

      - name: 编译 libish（真机 arm64 静态库）
        run: |
          cd native/ish
          # 使用 LLVM clang（支持 -fuse-ld=lld），ld.lld 已在 /usr/local/bin
          export PATH="/usr/local/opt/llvm/bin:$PATH"
          export CC=/usr/local/opt/llvm/bin/clang
          export CXX=/usr/local/opt/llvm/bin/clang++
          which clang && clang --version | head -1
          which ld.lld && ld.lld --version | head -1
          set -o pipefail
          xcodebuild -project iSH.xcodeproj \
            -target libish \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -60

      - name: 收集 .a 产物
        run: |
          mkdir -p build/ish-libs
          find native/ish -name "*.a" 2>/dev/null | while read f; do
            echo "找到: $f"
            cp "$f" build/ish-libs/
          done
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.a" 2>/dev/null | head -10 | while read f; do
            echo "DerivedData: $f"
            cp "$f" build/ish-libs/ 2>/dev/null || true
          done
          echo "=== 产物清单 ==="
          ls -la build/ish-libs/ 2>/dev/null || echo "（无 .a 产物，需调试构建）"

      - uses: actions/upload-artifact@v4
        with:
          name: ish-ios-libs
          path: build/ish-libs/
          retention-days: 30
          if-no-files-found: ignore