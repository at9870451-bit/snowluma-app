name: snowluma
description: "SnowLuma 前端 — Flutter UI + Rust Core（FFI JSON 总线，iOS）"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # dart:ffi 桥接 Rust Core 的辅助类型（Utf8 等）
  ffi: ^2.1.0
  # 状态管理
  provider: ^6.1.2
  # HTTP（SnowLuma WebUI API 传输）
  http: ^1.2.2
  file_picker: ^8.1.2
  # 沙盒目录（Rust Core 数据目录）
  path_provider: ^2.1.3
  # 扫码登录：内嵌 noVNC（QQ 远程桌面）
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
