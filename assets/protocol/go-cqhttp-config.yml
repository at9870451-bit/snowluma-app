# go-cqhttp 配置文件（iSH 专用预设）
# 用法：编辑本文件，把 uin: 0 改成你的 QQ 号，然后运行 ./go-cqhttp
account:
  uin: 0                    # ← 改成你的 QQ 号
  token: ''                 # 访问令牌（留空即可）
  max_reconnect_time: 0
  reconnect_interval: 0
  use_sso_address: false
  sign_servers:
    - url: ''
      key: ''
  heartbeat_interval: 5
  rate_limit_interval: 0
  post_message_format: string
  debug: false
  log_level: info

servers:
  # HTTP（OneBot 正向 HTTP）
  - http:
      host: 127.0.0.1
      port: 5700
      timeout: 5
      post_urls: {}
      token: ''
      debug: false
  # WebSocket（正向，QQBot 从这里连）
  - ws:
      host: 0.0.0.0
      port: 3001
      timeout: 5
      token: ''
      post_urls: {}
      debug: false